<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#17181a" />
		<title>Rogers</title>
		<style>
			html { background: #17181a; color: #e6e7e9; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
			main { text-align: center; padding: 24px; }
			h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
			p { color: #9aa0a6; margin: 0 0 20px; }
			button { background: #f2c744; color: #17181a; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 500; cursor: pointer; }
			button:focus-visible { outline: 2px solid #f2c744; outline-offset: 2px; }
		</style>
	</head>
	<body>
		<main>
			<h1>Rogers is offline</h1>
			<p>Your notes are safe on the server. They come back when the network does.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
