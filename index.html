<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Dark only. Both lines run before any stylesheet, so the browser paints
		     the dark ground on the first frame instead of a white flash.
		     The two hex values below are the one place --color-bg is repeated
		     outside src/web/styles/tokens.css. Change that token, change these. -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#17181a" />
		<style>
			html {
				background: #17181a;
			}
		</style>

		<!-- Google Sans, the one typeface. The range asks for the variable file, so
		     every weight the app uses arrives in one download per script. The
		     hebrew subset is part of the family, which is why notes that mix
		     Hebrew and English stay in one typeface. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap"
		/>

		<!-- The manifest is fetched WITH the login cookie. Cloudflare Access sits in
		     front of it, and a manifest fetched without credentials gets the login
		     page instead, which makes the app silently uninstallable. -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<title>Rogers</title>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
